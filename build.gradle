plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

// Project version properties should be in gradle.properties
version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation("net.fabricmc.fabric-api:fabric-events-interaction-v0:${project.fabric_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_version}")
	modImplementation "net.fabricmc.fabric-api:fabric-transfer-api-v1:${project.fabric_version}"

	// Fabric API (include base modules explicitly if needed)
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Modern processResources configuration
processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// Modern Java configuration
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

// Modern jar configuration
jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Fix for the Task.project deprecation
tasks.named('processResources') {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Modern publishing configuration
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		mavenLocal()
	}
}

// Task to copy the built JAR to a more convenient location
task copyJarToOutput(type: Copy) {
	from jar // copies the output of the jar task
	into file("output") // creates an output directory in your project root
}